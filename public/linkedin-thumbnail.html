<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn Thumbnail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: #0a192f;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .thumbnail {
      width: 1200px;
      height: 627px;
      background: #0a192f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px;
      position: relative;
      overflow: hidden;
      border: 2px solid #64ffda;
    }

    .content {
      z-index: 1;
      text-align: center;
    }

    h1 {
      font-size: 96px;
      font-weight: 700;
      color: #ccd6f6;
      margin-bottom: 24px;
      letter-spacing: -0.02em;
    }

    h2 {
      font-size: 48px;
      font-weight: 500;
      color: #64ffda;
      letter-spacing: -0.01em;
    }
  </style>
</head>
<body>
  <div class="thumbnail">
    <div class="content">
      <h1>Johannes Schulz</h1>
      <h2>AI Systems Engineer</h2>
    </div>
  </div>
</body>
</html>
